<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>eCOm - Product Detail</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4ad9;
            --secondary: #00d1c2;
            --success: #28a745;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
        }
        .product-gallery {
            border-radius: 15px 0 0 15px;
        }
        .product-thumb {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .product-thumb.active {
            border-color: var(--primary);
        }
        .price-large {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }
        .qty-input {
            width: 80px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop me-2"></i>eCOm
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarnav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarnav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="authBtn">Account</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="pt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-lg-5">
                <div class="product-gallery">
                    <div class="product-thumb active" th:each="image : ${productImages}">
                        <img th:src="${image}" class="img-fluid" style="height: 400px; object-fit: cover;"/>
                    </div>
                </div>
            </div>
            <div class="col-md-7 col-lg-7 px-5">
                <div class="card product-detail-card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="card-title mb-3" th:text="${product.name}"></h2>
                        <p class="card-text" th:text="${product.description}"></p>
                        
                        <div class="d-flex mb-3">
                            <span class="price-large" th:text="|$${#strings.format(product.price, '###,###.00')} |"></span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small">Quantity</label>
                            <div class="input-group qty-group">
                                <button class="btn btn-outline-secondary qty-btn" type="minus">-</button>
                                <input type="number" class="form-control qty-input" value="1" min="1">
                                <button class="btn btn-outline-secondary qty-btn" type="plus">+</button>
                            </div>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button class="btn btn-primary btn-lg" type="button" id="addToCartBtn">
                                <i class="bi bi-cart-plus me-2"></i>Add to Cart
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <a th:href="@{/products}" class="link-secondary">← Continue Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <span>2024 eCOm. All rights reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Quantity inputs
        const qtyBtns = document.querySelectorAll('.qty-btn');
        qtyBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('.qty-input');
                if (this.type === 'plus') {
                    input.value = Math.min(parseInt(input.value) + 1, 10);
                } else if (this.type === 'minus' && parseInt(input.value) > 1) {
                    input.value = Math.max(parseInt(input.value) - 1, 1);
                }
            });
        });
        
        // Add to cart button
        const addBtn = document.getElementById('addToCartBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function() {
                const quantity = parseInt(document.querySelector('.qty-input').value);
                // Would call backend API to add item
                alert(`Added ${quantity} item(s) to cart!`);
            });
        }
        
        // Auth button
        const authBtn = document.querySelector('#authBtn');
        if (authBtn) {
            authBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = '/login';
            });
        }
        
        // Tab functionality for product images
        const thumbElements = document.querySelectorAll('.product-thumb');
        if (thumbElements.length > 0) {
            thumbElements.forEach((thumb, index) => {
                thumb.addEventListener('click', function() {
                    thumbElements.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    // Would swap main image
                });
            });
        }
    });
</script>
</body>
</html>
