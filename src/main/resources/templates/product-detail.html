<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>eCOm - Product Detail</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">eCOm</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarnav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarnav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="pt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title mb-3" th:text="${product.name}"></h2>
                        <p class="card-text" th:text="${product.description}"></p>
                        <p class="fw-bold h4" th:text="|$${#strings.format(product.price, '###,###.00')} |"></p>
                        <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                        <a class="btn-link text-muted" href="/products">← Back to products</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <span>2024 eCOm. All rights reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
