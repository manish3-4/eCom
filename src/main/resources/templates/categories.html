<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>eCOm - Categories</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4ad9;
            --secondary: #00d1c2;
            --success: #28a745;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
        }
        .category-card {
            transition: all 0.3s ease;
            height: 100%;
        }
        .category-card:hover {
            background: var(--primary);
            color: white;
        }
        .category-card:hover .category-name,
        .category-card:hover .category-desc,
        .category-card:hover .view-btn {
            color: white;
        }
        .category-img {
            border-radius: 15px 15px 0 0;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .category-card:hover .category-img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop me-2"></i>eCOm
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarnav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarnav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="authBtn">Account</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="pt-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="animate__animated animate__fadeInDown">Product Categories</h2>
            <span class="badge bg-primary">3 Categories</span>
        </div>
        
        <div class="row g-4">
            <div class="col-md-4 col-lg-4" th:each="category : ${categories}">
                <div class="category-card animate__animated animate__fadeInUp" style="transition-delay: calc(0.1s * ${#index} )">
                    <div class="category-img" th:src="@{${category.imageUrl}}"></div>
                    <div class="category-body p-4">
                        <h5 class="category-name" th:text="${category.name}"></h5>
                        <p class="category-desc small text-muted" th:text="${category.description}"></p>
                        <a th:href="@{/category/products/{id}(id=${category.id})}" class="view-btn">View Products</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <span>2024 eCOm. All rights reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Category card hover effect
        const categoryCards = document.querySelectorAll('.category-card');
        categoryCards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
            });
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
        
        // Auth button
        const authBtn = document.querySelector('#authBtn');
        if (authBtn) {
            authBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = '/login';
            });
        }
    });
</script>
</body>
</html>
