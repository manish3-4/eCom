<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>eCOm - Category Products</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4ad9;
            --secondary: #00d1c2;
            --success: #28a745;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .product-img {
            border-radius: 15px 15px 0 0;
            height: 200px;
            object-fit: cover;
        }
        .price-tag {
            color: var(--primary);
            font-weight: bold;
        }
        .no-products {
            background: var(--light);
            padding: 4rem 2rem;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop me-2"></i>eCOm
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarnav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarnav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link active" href="/category/products">Category Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart <span class="badge bg-light text-primary">0</span></a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="authBtn">Account</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="pt-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="animate__animated animate__fadeInDown">Category: <span id="categoryName" th:text="${category.name}"></span></h2>
            <span class="badge bg-primary">Viewing all products in this category</span>
        </div>
        
        <div class="row g-4">
            <div class="col-md-12" th:if="${products.empty}">
                <div class="no-products">
                    <i class="bi bi-box-se me-2" style="font-size: 2rem; color: var(--primary); display: block; margin: 0 auto;"></i>
                    <h4>No products found</h4>
                    <p class="small text-muted">No products in this category yet.</p>
                </div>
            </div>
            <div class="col-md-6 col-lg-4" th:each="product : ${products}">
                <div class="product-card animate__animated animate__fadeInUp" style="transition-delay: calc(0.1s * ${#index} )">
                    <div class="card-body p-4">
                        <h5 class="card-title" th:text="${product.name}"></h5>
                        <p class="card-text small text-muted" th:text="${product.description}"></p>
                        <p class="price-tag"><strong>$${#strings.format(product.price, '###,###.00')}</strong></p>
                        <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-primary w-100 mt-2">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-5">
            <a href="/categories" class="btn btn-outline-primary px-4">Back to Categories</a>
        </div>
    </div>
</main>

<footer class="footer bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <span>2024 eCOm. All rights reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Set category name in breadcrumb
        const categoryName = document.getElementById('categoryName');
        // Would set from backend data
        
        // Auth button
        const authBtn = document.querySelector('#authBtn');
        if (authBtn) {
            authBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = '/login';
            });
        }
    });
</script>
</body>
</html>
